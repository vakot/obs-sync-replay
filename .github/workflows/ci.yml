name: Windows Build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-release -DOBS_SYNC_REPLAY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release
